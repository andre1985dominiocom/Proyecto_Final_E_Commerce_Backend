<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - DidiStore Admin</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <div class="admin-layout" data-admin-entity="products">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar__logo">DidiStore</div>
            <nav class="admin-sidebar__nav">
                <a href="dashboard.html" class="admin-sidebar__link">🏠 Dashboard</a>
                <a href="products.html" class="admin-sidebar__link admin-sidebar__link--active">📦 Productos</a>
                <a href="categories.html" class="admin-sidebar__link">🏷️ Categorías</a>
                <a href="orders.html" class="admin-sidebar__link">🛒 Pedidos</a>
                <a href="users.html" class="admin-sidebar__link">👥 Usuarios</a>
                <a href="promotions.html" class="admin-sidebar__link">🎉 Promociones</a>
            </nav>
            <div class="admin-sidebar__logout">
                <a href="../../html/auth/login.html" class="admin-sidebar__logout-link" data-logout-link>⬅ Cerrar sesión</a>
            </div>
        </aside>

        <!-- Main -->
        <div class="admin-main">
            <div class="admin-topbar">
                <span class="admin-topbar__title">Gestión de Productos</span>
                <span class="admin-topbar__user">Admin</span>
            </div>

            <div class="admin-content">
                <h1 class="admin-page-title">Productos</h1>

                <div class="admin-action-bar">
                    <div class="admin-search">
                        <input type="text" class="admin-search__input" id="admin-entity-search" placeholder="Buscar producto...">
                        <button class="admin-search__button" type="button">Buscar</button>
                    </div>
                    <select class="admin-search__input admin-filter-select" id="admin-entity-filter">
                        <option value="">Todos los estados</option>
                        <option value="disponible">Activo</option>
                        <option value="stock">Inactivo</option>
                    </select>
                    <a href="product-form.html" class="admin-btn admin-btn--primary">+ Agregar Producto</a>
                </div>

                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Imagen</th>
                                <th>Nombre</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>SKU</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="admin-entity-body"></tbody>
                    </table>
                </div>

                <div class="admin-pagination" id="admin-entity-pagination"></div>
            </div>
        </div>
    </div>
    
<div id="modal-inventario" class="admin-modal" style="display: none;">
        <div class="admin-modal__container">
            <div class="admin-modal__header">
                <h3>Gestionar Inventario</h3>
                <button id="btn-cerrar-modal" class="admin-modal__close">&times;</button>
             </div>
    
        <form id="form-inventario" class="admin-modal__form">
            <input type="hidden" id="inv-id" name="idInventario">

        <div class="admin-form__group">
            <label for="inv-actual">Stock Actual</label>
            <input type="number" id="inv-actual" name="stockActual" min="0" required class="admin-input">
        </div>

        <div class="admin-form__group">
            <label for="inv-minimo">Stock Mínimo</label>
            <input type="number" id="inv-minimo" name="stockMinimo" min="0" required class="admin-input">
        </div>

        <div class="admin-form__group">
            <label for="inv-reservado">Stock Reservado</label>
            <input type="number" id="inv-reservado" name="stockReservado" min="0" required class="admin-input">
        </div>

        <div class="admin-modal__footer">
            <button type="button" id="btn-cancelar-modal" class="admin-btn admin-btn--secondary">Cancelar</button>
            <button type="submit" class="admin-btn admin-btn--success">Guardar Cambios</button>
        </div>
        </form>
    </div>
</div>
    <script src="../../js/main.js" type="module"></script>
    <script src="../../js/admin/entity-table.js" type="module"></script>
</body>
</html>
