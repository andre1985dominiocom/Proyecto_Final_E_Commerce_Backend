<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos - DidiStore</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <header class="header">
        <div class="header__container container">
            <div class="header__logo">
                <h2 class="header__title"><a href="../../index.html">DidiStore</a></h2>
            </div>
            <nav class="navigation">
                <ul class="navigation__list">
                    <li class="navigation__item"><a class="navigation__link" href="../../index.html">Inicio</a></li>
                    <li class="navigation__item"><a class="navigation__link" href="../catalog/category.html">Categorías</a></li>
                    <li class="navigation__item"><a class="navigation__link" href="../promotions/promotions.html">Ofertas</a></li>
                    <li class="navigation__item"><a class="navigation__link" href="../components/footer.html">Contactos</a></li>
                    <li class="navigation__item"><a class="navigation__link" href="../account/account.html">Mi Cuenta</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="orders container" id="order-container">
            <h1 class="orders__title">Mis Pedidos</h1>

            <!-- RF-17: filtros por fecha y estado -->
            <form class="orders__filters" id="orders-filters" style="display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:1.25rem;align-items:flex-end;">
                <label style="display:flex;flex-direction:column;font-size:0.85rem;gap:0.25rem;">
                    Desde
                    <input type="date" id="filter-fecha-desde" name="fechaDesde"
                           style="padding:0.4rem;border:1px solid #ccc;border-radius:4px;">
                </label>
                <label style="display:flex;flex-direction:column;font-size:0.85rem;gap:0.25rem;">
                    Hasta
                    <input type="date" id="filter-fecha-hasta" name="fechaHasta"
                           style="padding:0.4rem;border:1px solid #ccc;border-radius:4px;">
                </label>
                <label style="display:flex;flex-direction:column;font-size:0.85rem;gap:0.25rem;">
                    Estado
                    <select id="filter-estado" name="estado"
                            style="padding:0.4rem;border:1px solid #ccc;border-radius:4px;">
                        <option value="">Todos</option>
                        <option value="Pendiente_Pago">Pendiente de pago</option>
                        <option value="Pagado">Pagado</option>
                        <option value="En_Preparacion">En preparación</option>
                        <option value="Despachado">Despachado</option>
                        <option value="En_Transito">En tránsito</option>
                        <option value="Entregado">Entregado</option>
                        <option value="Cancelado">Cancelado</option>
                        <option value="Devuelto">Devuelto</option>
                    </select>
                </label>
                <button type="submit" class="btn btn--primary">Filtrar</button>
                <button type="button" class="btn btn--secondary" id="filter-clear">Limpiar</button>
            </form>

            <div class="orders__list" id="orders-container">
                <p>Cargando pedidos...</p>
            </div>

            <div class="orders__empty" id="orders-empty" style="display:none;">
                <p class="orders__empty-text">Aún no tienes pedidos realizados.</p>
                <a href="../catalog/catalog.html" class="orders__shop-link">Ir a la tienda</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer__container container">
            <p class="footer__text">&copy; 2026 DidiStore. Todos los derechos reservados.</p>
        </div>
    </footer>
    <script src="../../js/main.js" type="module"></script>
    <script type="module" src="../../js/checkout/orders.js"></script>
</body>
</html>
