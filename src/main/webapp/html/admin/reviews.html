<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderación de Reseñas - DidiStore Admin</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <div class="admin-layout" data-admin-entity="reviews">
        <aside class="admin-sidebar">
            <div class="admin-sidebar__logo">DidiStore</div>
            <nav class="admin-sidebar__nav">
                <a href="dashboard.html" class="admin-sidebar__link">🏠 Dashboard</a>
                <a href="products.html" class="admin-sidebar__link">📦 Productos</a>
                <a href="categories.html" class="admin-sidebar__link">🏷️ Categorías</a>
                <a href="orders.html" class="admin-sidebar__link">🛒 Pedidos</a>
                <a href="users.html" class="admin-sidebar__link" data-role="admin-only">👥 Usuarios</a>
                <a href="promotions.html" class="admin-sidebar__link">🎉 Promociones</a>
                <a href="reviews.html" class="admin-sidebar__link admin-sidebar__link--active">⭐ Reseñas</a>
            </nav>
            <div class="admin-sidebar__logout">
                <a href="../../html/auth/login.html" class="admin-sidebar__logout-link" data-logout-link>⬅ Cerrar sesión</a>
            </div>
        </aside>

        <div class="admin-main">
            <div class="admin-topbar">
                <span class="admin-topbar__title">Moderación de Reseñas</span>
                <span class="admin-topbar__user">Admin</span>
            </div>

            <div class="admin-content">
                <h1 class="admin-page-title">Reseñas (RF-21)</h1>
                <p style="margin-bottom:1rem;opacity:0.8;">Aprueba o rechaza reseñas de compradores verificados antes de publicarlas.</p>

                <div class="admin-action-bar">
                    <select class="admin-search__input admin-filter-select" id="resenas-estado-filter">
                        <option value="Pendiente">Pendientes</option>
                        <option value="Aprobada">Aprobadas</option>
                        <option value="Rechazada">Rechazadas</option>
                        <option value="">Todas</option>
                    </select>
                    <button type="button" class="admin-btn admin-btn--primary" id="resenas-refresh">Actualizar</button>
                </div>

                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Usuario</th>
                                <th>Producto</th>
                                <th>Calif.</th>
                                <th>Comentario</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="resenas-body">
                            <tr><td colspan="7">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="../../js/main.js" type="module"></script>
    <script src="../../js/admin/reviews.js" type="module"></script>
</body>
</html>
