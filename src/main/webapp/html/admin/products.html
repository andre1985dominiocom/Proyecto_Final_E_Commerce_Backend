<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - DidiStore Admin</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-sidebar__logo">DidiStore</div>
            <nav class="admin-sidebar__nav">
                <a href="dashboard.html" class="admin-sidebar__link">🏠 Dashboard</a>
                <a href="products.html" class="admin-sidebar__link admin-sidebar__link--active">📦 Productos</a>
                <a href="categories.html" class="admin-sidebar__link">🏷️ Categorías</a>
                <a href="inventory.html" class="admin-sidebar__link">📊 Inventario</a>
                <a href="users.html" class="admin-sidebar__link" data-role="admin-only">👥 Usuarios</a>
            </nav>
            <div class="admin-sidebar__logout">
                <a href="#" class="admin-sidebar__logout-link" data-action="logout">⬅ Cerrar sesión</a>
            </div>
        </aside>

        <div class="admin-main">
            <div class="admin-topbar">
                <span class="admin-topbar__title">Gestión de Productos</span>
                <div class="admin-topbar__session">
                    <span class="admin-topbar__user" data-session="user-name">Usuario</span>
                    <span class="admin-topbar__role" data-session="user-role">ROL</span>
                </div>
            </div>

            <div class="admin-content">
                <h1 class="admin-page-title">Productos</h1>

                <div class="admin-action-bar">
                    <div class="admin-search">
                        <input
                            type="text"
                            class="admin-search__input"
                            id="products-search-input"
                            placeholder="Buscar por nombre, categoría o SKU..."
                        >
                    </div>

                    <a href="product-form.html" class="admin-btn admin-btn--primary">
                        + Agregar Producto
                    </a>
                </div>

                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>SKU</th>
                                <th>Stock</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="products-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../../js/admin/dashboard.js"></script>
    <script type="module" src="../../js/admin/products.js"></script>
</body>
</html>
