<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/modules/auth/login.css">
</head>
<body>
    <main class="auth">
        <section class="auth__card">
            <header class="auth__header">
                <h2 class="auth__title">Restablecer Contraseña</h2>
                <p class="auth__subtitle" id="reset-password-status">Ingresa tu nueva contraseña</p>
            </header>

            <form class="auth__form" id="reset-password-form">
                <label for="new-password" class="auth__label">Nueva Contraseña</label>
                <input
                    type="password"
                    id="new-password"
                    name="new-password"
                    class="auth__input"
                    required
                >

                <label for="confirm-password" class="auth__label">Confirmar Contraseña</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    class="auth__input"
                    required
                >

                <button type="submit" class="auth__button">Guardar Contraseña</button>
            </form>

            <hr class="auth__divider">

            <footer class="auth__footer">
                <a href="../auth/login.html" class="auth__link">Volver al inicio de sesión</a>
            </footer>
        </section>
    </main>
    <script src="../../js/auth/reset-password.js" type="module"></script>
</body>
</html>
